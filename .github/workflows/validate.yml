name: Validate skill

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Agent Skills specification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check GitHub CLI version
        shell: bash
        run: |
          required="2.90.0"
          current="$(gh version | sed -n '1s/gh version \([^ ]*\).*/\1/p')"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            echo "GitHub CLI $required or later is required; runner has $current."
            exit 1
          fi

      - name: Validate publishable skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run
